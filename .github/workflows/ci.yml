name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UPM
        run: pip install git+https://github.com/fl-sean03/upm.git@main

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

      - name: Lint
        run: ruff check src/iff_parameters/

  validate-bundles:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/fl-sean03/upm.git@main
      - run: pip install -e .
      - run: python scripts/validate.py
