name: CI

on:
  push:
    branches: [main, "v0.2-rebuild"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UPM (v2.1+)
        run: pip install "git+https://github.com/fl-sean03/upm.git@main"

      - name: Install USM (optional; structure tests skip if missing)
        run: pip install "git+https://github.com/fl-sean03/usm.git@main"
        continue-on-error: true

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/ dashboard/

      - name: Tests
        run: pytest -q --tb=short

  validate-library:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/fl-sean03/upm.git@main"
      - run: pip install -e .

      - name: Validate library (V-1..V-10)
        run: python scripts/validate.py --json /tmp/validate_report.json

      - name: Immutability check (advisory)
        run: python scripts/check_immutability.py || true

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-report
          path: /tmp/validate_report.json
